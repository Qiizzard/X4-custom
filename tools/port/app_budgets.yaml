# app_budgets.yaml -- declared RAM footprint for every app compiled into the
# firmware. The budget gate (tools/port/budget_check.py) reads this on every PR.
#
# HOW TO FILL THIS IN (do not guess in anger -- measure):
#   static_bytes     : always-resident cost -- file-scope globals, BSS, non-const
#                      `static` members, RAM string tables. (const tables in
#                      flash/DROM cost 0 here.)
#   object_bytes     : sizeof(the Activity subclass) -- the heap allocation made
#                      when the screen is pushed. Get it from a static_assert or
#                      the .map file.
#   peak_heap_bytes  : the MOST heap this app holds at once while running. 0 if none.
#   tier             : c3 (must fit the base X4, enforced) | psram (X4 Pro only).
#
# Numbers below are first-pass estimates -- replace with measured values before
# each app ships. The gate is only as honest as this file.
#
# WHAT A "PASS" HERE MEANS: that the *declared* budget fits the ceiling. It does
# NOT mean the app exists. Most entries below were declared ahead of the port and
# the app is not in the tree yet -- see docs/merge/PORT_LEDGER.md for what has
# actually landed. Keep declaring budgets up front (it is the cheapest moment to
# notice an app will not fit), but do not read a green gate as a shipped app.
#
# FLASH: this manifest measures declared RAM, not the linked firmware image.
# PlatformIO already runs scripts/check_firmware_size.py against the smallest
# configured app slot. It fails on overflow and warns below the 256 KiB reserve;
# CROSSINK_FLASH_FAIL_UNDER_RESERVE=1 makes the reserve a hard failure.
# Batch 5 snapshot: 6,316,256-byte image / 6,553,600-byte slot, 237,344 bytes free.
# See docs/merge/verification/BATCH_6_FLASH_2026-09-09.md.
# Per-app deltas require controlled before/after builds; object-file averages
# are not additive flash budgets. Keep the recovery/expansion gate.

apps:
  # ---- Ported & wired into the Tools launcher (safe tier, no radio) ----
  - name: Calculator          # ported by v1, moved into src/ and re-audited; measured sizeof
    tier: c3
    static_bytes: 0
    object_bytes: 584
    peak_heap_bytes: 0

  - name: UnitConverter       # ported; nested vectors -> constexpr tables in flash; measured sizeof
    tier: c3
    static_bytes: 0
    object_bytes: 616
    peak_heap_bytes: 512

  - name: Snake                 # ported; nit: reserve() the snake vector to its cap
    tier: c3
    static_bytes: 128
    object_bytes: 256
    peak_heap_bytes: 6144       # snake body vector at max board fill

  - name: Minesweeper           # ported; nit: header uses std::string -> snprintf
    tier: c3
    static_bytes: 128
    object_bytes: 512           # grid[10][16] in-object
    peak_heap_bytes: 512

  - name: Sudoku                # ported, cleanest of the batch
    tier: c3
    static_bytes: 128
    object_bytes: 320           # board[9][9] + fixed[9][9] in-object
    peak_heap_bytes: 0

  - name: AppLauncher           # the tile grid; one instance per level (root, category)
    tier: c3
    static_bytes: 0             # the app table is constexpr -> flash, 0 DRAM
    object_bytes: 2628          # dominated by FreeInkApp<32,4>'s interaction buffer
    peak_heap_bytes: 1024       # ListItem vector, reserved to the row count

