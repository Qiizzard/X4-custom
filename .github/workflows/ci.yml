name: CI (build)

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  # --- x4-merge gates ---------------------------------------------------
  # Added on top of the upstream CrossInk CI, not in place of it: clang-format
  # and cppcheck above are the base repo's own gates and stay exactly as they
  # were. Everything below is what docs/merge/GOVERNANCE.md means by "no app
  # merges without a budget PASS".

  budget:
    name: memory budget gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - run: pip install pyyaml

      # The gate's own tests run first. A budget checker that silently stops
      # checking is worse than no checker, because the checklist claims it ran.
      - name: budget gate self-test
        run: python3 tools/port/test_budget_check.py

      - name: enforce app budgets (fails if any c3 app blows the ceiling)
        run: python3 tools/port/budget_check.py

  native-tests:
    name: native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # CrossInk's existing GoogleTest suite (parsers, layout, hyphenation, ...)
      # plus the merge foundations registered into it: test/ring_buffer covers
      # the RULESET rule 10 primitive, test/secure_store the rule 22 crypto.
      # SecureStore's mbedtls is fetched and pinned by test/secure_store's
      # CMakeLists, so CI and a laptop test the same version the firmware links.
      - name: configure
        run: cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build/test -j"$(nproc)"

      - name: run
        run: ctest --test-dir build/test --output-on-failure


  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [default, sticky, simulator]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-${{ matrix.environment }}-
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      # The simulator target is a native SDL2 binary, not firmware.
      - name: Install SDL2 for the simulator target
        if: matrix.environment == 'simulator'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build ${{ matrix.environment }} firmware
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.environment }} | tee pio-${{ matrix.environment }}.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.environment }} firmware build stats"
            grep -E "RAM:\s|Flash:\s" pio-${{ matrix.environment }}.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifacts
        if: matrix.environment == 'default'
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x3-x4
          path: |
            .pio/build/default/firmware-x3-x4.bin
          if-no-files-found: error

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
      - budget
      - native-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
